name: Build & Sync With Adobe Git Repo

on:
  workflow_dispatch:
    inputs:
      artifactsJson:
        description: 'Maven artifacts represented as JSON array. E.g [{"groupId":"com.practice","artifactId":"practice-lib","version":"1.0.0"}]'
        required: false
        default: '[]'
      sync_artifacts:
        description: 'Sync artifacts'
        required: true
        default: 'true'
      deploy_artifacts:
        description: 'Deploy artifacts'
        required: true
        default: 'false'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    env:
      MAVEN_PRIVATE_REPO_USERNAME: ${{ secrets.MAVEN_PRIVATE_REPO_USERNAME }}
      MAVEN_PRIVATE_REPO_PASSWORD: ${{ secrets.MAVEN_PRIVATE_REPO_PASSWORD }}
      MAVEN_PRIVATE_REPO_URL: ${{ secrets.MAVEN_PRIVATE_REPO_URL }}
      CM_AIO_ORG_ID: ${{ secrets.CM_ORG_ID }}      
      CM_AIO_PROGRAM_ID: ${{ secrets.CM_PROGRAM_ID }}
      CM_PROD_PIPELINE_ID: ${{ secrets.CM_PROD_PIPELINE_ID }}
      CM_DEV_PIPELINE_ID: ${{ secrets.CM_DEV_PIPELINE_ID }}
      CM_RDE_ENV_ID: ${{ secrets.CM_RDE_ENV_ID }}
      GS4TR_REPO_PASSWORD: ${{ secrets.GS4TR_REPO_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add/Update remote submodule jpmcp-m2-repo
        run: |
            set -x
            submodule_url="${{ secrets.REMOTE_GIT_REPO_SUBMODULE_URL }}"
            submodule_url="${submodule_url#https://}"
            echo "https://${{ secrets.REMOTE_REPO_USERNAME }}:${{ secrets.REMOTE_REPO_PASSWORD }}@$submodule_url" > ~/.git-credentials
            git config --global credential.helper store
            if [ -d "jpmcp-m2-repo" ]; then
              echo "Submodule jpmcp-m2-repo already exists"
            else
              git submodule add -b non-prod/dev "${{ secrets.REMOTE_GIT_REPO_URL }}" jpmcp-m2-repo
            fi
            git submodule update --init --recursive
            cd jpmcp-m2-repo
            branch_name=$(git config -f ../.gitmodules submodule.$(basename $(pwd)).branch)
            if git show-ref --verify --quiet refs/heads/$branch_name; then
              git checkout $branch_name
            else
              git checkout -b $branch_name origin/$branch_name
            fi
            cd ..
            git submodule update --remote --merge jpmcp-m2-repo
            git status
      - name: Validate Artifacts JSON
        id: validate-json
        run: |
          if [ -n "${{ github.event.inputs.artifactsJson }}" ]; then
            if [ "$(echo "${{ github.event.inputs.artifactsJson }}" | jq length)" -eq 0 ]; then
              echo "artifact_json_valid=false" >> $GITHUB_ENV
            else
              echo "${{ github.event.inputs.artifactsJson }}" | jq '.' > artifacts.json
              echo "artifact_json_valid=true" >> $GITHUB_ENV
            fi  
          else
            echo "No artifacts JSON provided."
            echo "artifact_json_valid=false" >> $GITHUB_ENV
          fi
      - name: Process Artifacts JSON
        if: env.artifact_json_valid == 'true'
        run: |
          set -e
          set -x
          ls -ltr all/
          echo "${{ github.event.inputs.artifactsJson }}" | jq '.' > artifacts.json
          python scripts/process_artifacts.py --json-content "$(cat artifacts.json)"
          git --no-pager diff all/pom.xml
          ls -ltrR all/lib
  
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      
      - name: Configure Maven Settings
        uses: s4u/maven-settings-action@v3.1.0
      - name: Install Other Dependencies
        run: |
          pip install lxml requests
      - name: Install Filesystem Maven Artifacts
        if: github.ref_name == 'develop'
        run: |
          python scripts/install_fs_artifacts.py
      - name: Validate Build
        if: github.ref_name == 'develop'
        run: |
          mvn clean install -DskipTests -PcopyDependencies
      - name: List Copied Artifacts
        if: github.ref_name == 'develop'
        run: |
          ls -ltrR jpmcp-m2-repo/com/
      - name: Set up Node.js
        if: github.event.inputs.deploy_artifacts == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Adobe IO CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        if: github.event.inputs.deploy_artifacts == 'true'

      - name: Install & Configure - Adobe I/O CLI & Plugins
        if: github.event.inputs.deploy_artifacts == 'true'
        run: |
          set -e
          set -x
          aio plugins:install @adobe/aio-cli-plugin-cloudmanager
          echo "${{ secrets.CM_API_SERVICE_ACCOUNT_JSON }}" | base64 --decode > /tmp/aio-service-account.json
          aio config:set ims.contexts.aio-cli-plugin-cloudmanager /tmp/aio-service-account.json --file --json
          echo "config json reset"
          aio config:set cloudmanager_programid ${{ env.CM_AIO_PROGRAM_ID }}
          echo "program id set"
          aio cloudmanager:program:list-pipelines
          echo "above pipelines are the accurate list for the given program id"
          aio plugins:install @adobe/aio-cli-plugin-aem-rde
          aio plugins:update
          aio cloudmanager:program:list-environments
          echo "Above command displays latest list of environments"
          aio config:set ims.contexts.aio-cli-plugin-aem-rde /tmp/aio-service-account.json --file --json
          aio config:set cloudmanager_orgid ${{ env.CM_AIO_ORG_ID }}
          # aio config:set cloudmanager_environmentid ${{ env.CM_RDE_ENV_ID }}
          aio config:set cloudmanager_environmentid 1544319
          aio aem:rde:status

      - name: Deploy to RDE (Develop)
        if: github.ref_name == 'develop' && github.event.inputs.deploy_artifacts == 'true'
        run: |
          set -e
          set -x
          # aio aem:rde:setup
          # Install the 'all' content package (zip file)
            zip_files=$(ls all/target/*.zip)
            for zip_file in $zip_files; do
            if [[ $zip_file =~ ^all/target/[^/]+-[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?\.zip$ ]]; then
              aio aem:rde:install $zip_file
            else
              echo "File $zip_file does not meet the criteria."
            fi
            done
      - name: Common Git Config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      - name: Commit downloaded artifacts (Develop)
        if: github.ref_name == 'develop'
        run: |
          git add all/pom.xml
          git add all/lib/*
          if git diff --cached --quiet; then
              echo "No changes to commit."
            else
                git commit -m "Add downloaded artifacts to all/lib + POM Updates"
                git status
                git push origin HEAD
            fi

      - name: Commit Private Artifacts (Develop)
        if: github.ref_name == 'develop' && (github.event.inputs.deploy_artifacts == 'true' || github.event.inputs.sync_artifacts == 'true')
        run: |
          set -e
          set -x
          # Commit the version change back to the repository
          cd jpmcp-m2-repo
          git remote -v
          git status
          git fetch
          branch_name=$(git config -f ../.gitmodules submodule.$(basename $(pwd)).branch)
          git add com/* || true
          git add net/* || true
          git status
          if ! git diff --cached --quiet; then
              git commit -m "private artifacts - updated at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              git push origin $branch_name
          else
            echo "No changes to commit."
          fi
          cd ..
          git submodule update --remote --merge jpmcp-m2-repo
          git add jpmcp-m2-repo
          git status
          if ! git diff --cached --quiet; then
            git commit -m "Update submodule jpmcp-m2-repo"
            git push origin
          else
            echo "No changes to commit."
          fi
      - name: Add Adobe Git Remote & Pull Remote Changes If Any
        run: |
          set -e
          set -x
          git show-ref --verify --quiet refs/heads/sandbox/develop-artifacts && git branch -D sandbox/develop-artifacts
          git remote remove adobe || true
          remote_url="${{ secrets.REMOTE_GIT_REPO_URL }}"
          remote_url="${remote_url#https://}"
          echo "https://${{ secrets.REMOTE_REPO_USERNAME }}:${{ secrets.REMOTE_REPO_PASSWORD }}@$remote_url" >> ~/.git-credentials
          git config --global credential.helper store
          git remote add adobe "${{ secrets.REMOTE_GIT_REPO_URL }}"
          git fetch adobe
          if ! git merge-base --is-ancestor adobe/sandbox/develop-artifacts develop; then
            echo "Unrelated histories detected. Resetting commit history of remote branch."
            git checkout adobe/sandbox/develop-artifacts
            git checkout -b sandbox/develop-artifacts-reset
            git reset --hard develop
          git push adobe sandbox/develop-artifacts-reset:refs/heads/sandbox/develop-artifacts --force
          else
            git pull adobe sandbox/develop-artifacts --rebase
            git fetch adobe --tags
          fi

      - name: Sync with Adobe Git (Develop)
        if: github.ref_name == 'develop' && (github.event.inputs.deploy_artifacts == 'true' || github.event.inputs.sync_artifacts == 'true')
        run: |
          set -e
          set -x
          git status
          git checkout -b sandbox/develop-artifacts adobe/sandbox/develop-artifacts
          git pull adobe sandbox/develop-artifacts
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # May result in conflicts when done for the first time
          if ! git merge develop --allow-unrelated-histories --strategy-option ours --no-edit; then
            echo "Merge conflicts detected:"
            git diff --name-only --diff-filter=U
            git diff
            exit 1
          fi
          git rev-parse --is-shallow-repository
          git status
          git push adobe sandbox/develop-artifacts
          # rm -Rf all/maven-repo/com/practice/
          # git apply /tmp/patches/private-artifacts.patch
          # git add all/maven-repo/com/practice/*
          # git commit -m "resetting private artifacts"
          git config --list
          git --version
          git log --oneline -n 5
          git rev-parse --is-shallow-repository
          git status
          git push adobe sandbox/develop-artifacts
          rm -Rf ~/.git-credentials
          git checkout develop

      - name: Bump Version (Develop)
        if: github.ref_name == 'develop' && github.event.inputs.deploy_artifacts == 'true' && success()
        run: |
          # Increment the version for the next snapshot
          current_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          new_version=$(echo $current_version | sed 's/-SNAPSHOT$//') # Remove SNAPSHOT for version increment

          # Increment the version (e.g., 1.0.0 -> 1.0.1)
          new_version=$(echo $new_version | awk -F. -v OFS=. '{ $NF++; } 1')-SNAPSHOT

          # Update the version in the pom.xml
          mvn versions:set -DnewVersion=$new_version

          # Commit the version change back to the repository
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "Bump version to $new_version"
          git push origin develop


      - name: Deploy Packages (AEMaaCS Dev Env)
        if: github.ref_name == 'develop' && github.event.inputs.deploy_artifacts == 'true'
        run: |
          aio cloudmanager pipeline create-execution ${{ env.CM_DEV_PIPELINE_ID }}
